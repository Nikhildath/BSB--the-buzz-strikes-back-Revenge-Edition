; ESP32 #1 — Trap Controller
; PlatformIO Configuration

[env:trap_controller]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
  ; No external libs needed for this board
  
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -DARDUINO_EVENT_RUNNING_CORE=1

board_build.filesystem_size = 0m
